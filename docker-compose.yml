services:
  matcher:
    build: .
    command: ["/matcher"]
    ports:
      - "50051:50051"
      - "2112:2112"
    healthcheck:
      test: ["CMD", "/matcher", "-health"]
      interval: 2s
      timeout: 2s
      retries: 15
    stop_grace_period: 10s

  loadgen:
    build: .
    command: ["/loadgen"]
    environment:
      MATCHER_ADDR: matcher:50051
      MATCHER_CONNS: "4"
      ORDER_INFLIGHT: "1000"
      ORDER_RATE: "1000"
      DRIVER_WORKERS: "4"
      UPDATE_BATCH: "10"
      DURATION: 24h
      METRICS_ADDR: ":2112"
      OUT: /tmp/results.json
    depends_on:
      matcher:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/geomatch.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
