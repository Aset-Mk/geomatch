syntax = "proto3";

package matcher.v1;

option go_package = "github.com/Aset-Mk/geomatch/internal/pb/matcherv1;matcherv1";

service Matcher {
  // Nearest returns up to k drivers closest to the point, sorted by distance
  rpc Nearest(NearestRequest) returns (NearestResponse);

  // UpdateDrivers takes driver positions, several per message
  rpc UpdateDrivers(stream UpdateDriversRequest) returns (UpdateDriversResponse);

  // RemoveDriver drops a driver, unknown ids are ignored
  rpc RemoveDriver(RemoveDriverRequest) returns (RemoveDriverResponse);
}

message Point {
  double lat = 1;
  double lon = 2;
}

message NearestRequest {
  Point point = 1;
  uint32 k = 2;
}

message Neighbor {
  uint64 driver_id = 1;
  double distance_m = 2;
}

message NearestResponse {
  repeated Neighbor neighbors = 1;
}

message DriverUpdate {
  uint64 driver_id = 1;
  Point pos = 2;
}

message UpdateDriversRequest {
  repeated DriverUpdate updates = 1;
}

message UpdateDriversResponse {}

message RemoveDriverRequest {
  uint64 driver_id = 1;
}

message RemoveDriverResponse {}

service Orders {
  // CreateOrder offers the order to the nearest free drivers in turn and answers once one accepts or none is left
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);

  // Offers streams every offer the matcher makes, the side that plays drivers answers them with AnswerOffer
  rpc Offers(OffersRequest) returns (stream Offer);

  // AnswerOffer accepts or declines an offer, an offer that is no longer open gives FailedPrecondition
  rpc AnswerOffer(AnswerOfferRequest) returns (AnswerOfferResponse);

  // CompleteOrder ends the ride and frees the driver
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse);
}

message CreateOrderRequest {
  Point pickup = 1;
}

message CreateOrderResponse {
  uint64 order_id = 1;
  // false when no free driver accepted the order
  bool assigned = 2;
  uint64 driver_id = 3;
}

message OffersRequest {}

message Offer {
  uint64 order_id = 1;
  uint64 driver_id = 2;
  Point pickup = 3;
}

message AnswerOfferRequest {
  uint64 order_id = 1;
  uint64 driver_id = 2;
  bool accept = 3;
}

message AnswerOfferResponse {}

message CompleteOrderRequest {
  uint64 order_id = 1;
  uint64 driver_id = 2;
}

message CompleteOrderResponse {}
